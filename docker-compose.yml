
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bank-loan-postgres
    environment:
      POSTGRES_DB: bank_loan_db
      POSTGRES_USER: bank_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_app -d bank_loan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
